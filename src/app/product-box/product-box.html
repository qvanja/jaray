<br>

      <div class="card">
      <div class="product-grid4">
        <div class="product-image4">
          <a [routerLink]="['/products-detail']"
          [queryParams]="{product_id: product.id}">
            <div style="cursor: pointer" ><img
              class="pic-1"
              [src]="product.imageUrl"
              onerror="this.src='/assets/No_Image_Available.jpg';"
            />
              <img
                class="pic-2"
                [src]="product.imageUrl"
                onerror="this.src='/assets/No_Image_Available.jpg';"
              /></div>
          </a>

        </div>
        <div class="product-content">
          <h3 class="title"><a href="#"
          >{{product.name}}</a></h3>
          <div class="price">
            {{ product.price | currency  }}
          </div>
          <div class="price2">
            {{ product.price | khmerCurrency }}
          </div>
          <a class="add-to-cart" (click)="onAddToCart(product)">ADD TO CART</a>
        </div>
      </div>
      </div>
