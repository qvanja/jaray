<div class="container mt-4">
  <h2>Checkout</h2>

  <table class="table table-bordered table-striped mt-3">
    <thead class="table-dark">
    <tr>
      <th>Image</th>
      <th>Product</th>
      <th>Price</th>
      <th>Qty</th>
      <th>Total</th>
    </tr>
    </thead>
    <tbody>
      @for (item of cartItems; track item.name) {
        <tr>
          <td><img [src]="item.imageUrl" alt="{{ item.name }}" width="60"  onerror="this.src='/assets/No_Image_Available.jpg';"></td>
          <td>{{ item.name }}</td>
          <td>{{ item.price | currency }}</td>
          <td>
            <span class="mx-2">{{ item.qty }}</span>
          </td>
          <td>{{ item.price * item.qty | currency }}</td>

        </tr>
      } @empty {
        <tr>
          <td colspan="6" class="text-center text-muted">Your cart is empty.</td>
        </tr>
      }
    </tbody>
  </table>

  <div class="text-end mt-3">
    <h4>Grand Total: {{ total | currency }}</h4>
    <h4>Grand Total: {{ total | khmerCurrency }}</h4>
    <button class="btn btn-success btn-lg" (click)="checkout()">PAY NOW</button>
  </div>
</div>
