
<div class="container py-5">
  <div class="row">

    <!-- Product Image -->
    <div class="col-md-6 mb-4">
      <img alt="Product Image" class="product-img img-fluid shadow-sm"
           src="{{product.imageUrl}}"
           onerror="this.src='/assets/No_Image_Available.jpg';">
    </div>
    <!-- Product Details -->
    <div class="col-md-6">
      <h2 class="mb-3">{{ product.name }}</h2>
      <p class="price">{{product.price | currency}}</p>
      <p class="price">{{product.price | khmerCurrency}}</p>
      <div class="mt-4">
        <button class="btn btn-outline-secondary btn-lg" (click)="addToCart()">Add to Cart</button>
      </div>
    </div>
  </div>
</div>
